<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>张毅老师的课堂知识库</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --border: #e8e8e8;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.04);
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
        "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.55;
      min-height: 100vh;
    }

    .app {
      max-width: 960px;
      margin: 0 auto;
      padding: 1rem 1rem 2rem;
      min-height: 100vh;
    }

    .icon-btn {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      padding: 0.35rem 0.65rem;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--muted);
      box-shadow: var(--shadow);
    }

    .icon-btn:hover {
      color: var(--fg);
      border-color: #d0d0d0;
    }

    .nav-back-row {
      margin-bottom: 1rem;
    }

    .content-card {
      padding: 1.25rem 1.5rem;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: auto;
      min-height: 200px;
    }

    .folder-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .folder-tab {
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fafafa;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      font-family: inherit;
      color: var(--fg);
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }

    .folder-tab:hover {
      border-color: #bfdbfe;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .folder-tab.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .browse-tags-title {
      margin: 0 0 0.6rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
    }

    .browse-tag-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 1rem;
      align-items: center;
    }

    .tag-badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 0.75rem;
      background: #f4f4f5;
      border: 1px solid var(--border);
      color: var(--fg);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .tag-badge:hover {
      background: var(--accent-soft);
      border-color: #bfdbfe;
      color: var(--accent);
    }

    .hint {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .error {
      color: #b91c1c;
      font-size: 0.9rem;
    }

    #doc-html-frame {
      width: 100%;
      min-height: 400px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }

    .md-body :first-child {
      margin-top: 0;
    }

    .md-body pre {
      background: #f8f8f9;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      overflow: auto;
      border: 1px solid var(--border);
    }

    .md-body code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.88em;
    }

    .tag-filter-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .tag-filter-list li {
      margin-bottom: 0.35rem;
    }

    .tag-filter-list button {
      width: 100%;
      text-align: left;
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fafafa;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .tag-filter-list button:hover {
      border-color: #bfdbfe;
      background: var(--accent-soft);
    }

    .path-muted {
      font-size: 0.8rem;
      color: var(--muted);
      margin-left: 0.35rem;
    }

    .home-head {
      margin: 0 0 0.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    /* --- Exam styles --- */
    .exam-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 0 0 0.5rem;
      line-height: 1.4;
    }
    .exam-meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .exam-meta span {
      margin-right: 0.75rem;
    }
    .exam-section-title {
      font-weight: 600;
      font-size: 1rem;
      margin: 1.25rem 0 0.75rem;
    }
    .question-card {
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
      background: #fff;
      transition: border-color 0.25s, background 0.25s;
    }
    .question-card.correct {
      border-color: #22c55e;
      background: #f0fdf4;
    }
    .question-card.wrong {
      border-color: #ef4444;
      background: #fef2f2;
    }
    .q-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }
    .q-number {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .q-type {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.1rem 0.45rem;
      border-radius: 4px;
      background: #e0e7ff;
      color: #4338ca;
    }
    .q-type.multi {
      background: #fce7f3;
      color: #be185d;
    }
    .q-text {
      font-size: 0.95rem;
      margin-bottom: 0.6rem;
      line-height: 1.5;
    }
    .options-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 0.4rem 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s;
      border: 1px solid transparent;
      margin-bottom: 0.25rem;
    }
    .option-item:hover {
      background: #f4f4f5;
    }
    .option-item.selected {
      background: #eff6ff;
      border-color: #93c5fd;
    }
    .option-item input {
      margin-top: 0.2rem;
      flex-shrink: 0;
    }
    .option-label {
      font-weight: 600;
      flex-shrink: 0;
    }
    .option-text {
      flex: 1;
    }
    .exam-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .btn-primary {
      padding: 0.6rem 1.5rem;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-reset {
      padding: 0.6rem 1.5rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--fg);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-reset:hover {
      background: #f4f4f5;
    }
    .exam-score {
      margin-top: 1rem;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      padding: 0.75rem;
      border-radius: 8px;
      background: #f4f4f5;
    }
    .exam-timer {
      display: inline-block;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 0.35rem 0.85rem;
      border-radius: 8px;
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
      margin-bottom: 1rem;
      font-variant-numeric: tabular-nums;
    }
    .exam-timer.warning {
      background: #fef2f2;
      color: #dc2626;
      border-color: #fecaca;
      animation: timer-pulse 1s ease-in-out infinite;
    }
    @keyframes timer-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .option-item.correct-answer {
      background: #f0fdf4;
      border-color: #86efac;
    }
    .option-item.wrong-selected {
      background: #fef2f2;
      border-color: #fca5a5;
    }
    .option-item.disabled {
      opacity: 0.6;
      cursor: default;
    }
    .option-item.disabled:hover {
      background: inherit;
    }
  </style>
</head>
<body>
  <div class="app">
    <main class="content-card" id="content-view">
      <p class="hint">正在加载索引…</p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="./index.inline.js"></script>
  <script>
    (function () {
      /** @type {{ folders: { name: string, files: { name: string, path: string, tags: string[] }[] }[] }} */
      let indexData = { folders: [] };
      let currentFolderName = "";
      let docGeneration = 0;

      function bumpDocGeneration() {
        docGeneration++;
      }

      const elContentView = document.getElementById("content-view");

      function appendNavBack(targetHash) {
        const wrap = document.createElement("div");
        wrap.className = "nav-back-row";
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "icon-btn";
        btn.textContent = "← 返回";
        btn.addEventListener("click", function () {
          window.location.hash = targetHash;
        });
        wrap.appendChild(btn);
        elContentView.appendChild(wrap);
      }

      function encodeSeg(s) {
        return encodeURIComponent(s).replace(/[!'()*]/g, function (c) {
          return "%" + c.charCodeAt(0).toString(16).toUpperCase();
        });
      }

      function decodeSeg(s) {
        try {
          return decodeURIComponent(s);
        } catch {
          return s;
        }
      }

      function parseHash() {
        const raw = window.location.hash.replace(/^#/, "").replace(/^\//, "");
        if (!raw) return { kind: "home" };
        const parts = raw.split("/").map(decodeSeg);
        if (parts[0] === "tag" && parts.length >= 2) {
          return { kind: "tag", tag: parts.slice(1).join("/") };
        }
        if (parts[0] === "browse") {
          if (parts.length >= 4 && parts[2] === "tag") {
            return { kind: "browse_tag", folder: parts[1], tag: parts.slice(3).join("/") };
          }
          if (parts.length >= 2) {
            return { kind: "browse", folder: parts[1] };
          }
          return { kind: "home" };
        }
        if (parts.length >= 2) {
          return { kind: "doc", folder: parts[0], file: parts.slice(1).join("/") };
        }
        return { kind: "home" };
      }

      function setHashBrowse(folderName) {
        const h = "#/browse/" + encodeSeg(folderName);
        if (window.location.hash !== h) {
          window.location.hash = h;
        }
      }

      function setHashBrowseTag(folderName, tag) {
        const h = "#/browse/" + encodeSeg(folderName) + "/tag/" + encodeSeg(tag);
        if (window.location.hash !== h) {
          window.location.hash = h;
        }
      }

      function setHashDoc(folderName, fileName) {
        const h = "#/" + encodeSeg(folderName) + "/" + encodeSeg(fileName);
        if (window.location.hash !== h) {
          window.location.hash = h;
        }
      }

      function setHashTag(tag) {
        const h = "#/tag/" + encodeSeg(tag);
        if (window.location.hash !== h) {
          window.location.hash = h;
        }
      }

      function findFileEntry(folderName, fileName) {
        const folder = indexData.folders.find(function (f) {
          return f.name === folderName;
        });
        if (!folder) return null;
        const wantPath = folderName + "/" + fileName;
        const candidates = folder.files.filter(function (x) {
          return x.name === fileName || x.path === wantPath || x.path.endsWith("/" + fileName);
        });
        if (!candidates.length) return null;
        const exact = candidates.find(function (x) {
          return x.path === wantPath;
        });
        const entry = exact || candidates[0];
        return { folder: folderName, entry: entry };
      }

      function collectTaggedFiles(tag) {
        const out = [];
        indexData.folders.forEach(function (folder) {
          folder.files.forEach(function (file) {
            if ((file.tags || []).indexOf(tag) !== -1) {
              out.push({ folder: folder.name, file: file });
            }
          });
        });
        return out;
      }

      function collectTaggedFilesInFolder(folderName, tag) {
        const out = [];
        const folder = indexData.folders.find(function (f) {
          return f.name === folderName;
        });
        if (!folder) return out;
        folder.files.forEach(function (file) {
          if ((file.tags || []).indexOf(tag) !== -1) {
            out.push({ folder: folder.name, file: file });
          }
        });
        return out;
      }

      /** 若 name 无效则回退到第一个文件夹 */
      function resolveBrowseFolder(name) {
        if (!indexData.folders.length) return "";
        if (name && indexData.folders.some(function (f) { return f.name === name; })) {
          return name;
        }
        return indexData.folders[0].name;
      }

      /** 某文件夹内去重标签，按中文排序；无标签的不列入 */
      function collectFolderTagsSorted(folderName) {
        const set = new Set();
        const folder = indexData.folders.find(function (f) {
          return f.name === folderName;
        });
        if (!folder) return [];
        folder.files.forEach(function (file) {
          (file.tags || []).forEach(function (t) {
            if (t) set.add(t);
          });
        });
        return Array.from(set).sort(function (a, b) {
          return a.localeCompare(b, "zh-CN");
        });
      }

      function renderBrowse(folderName) {
        bumpDocGeneration();
        revokeIframeBlob();
        currentFolderName = folderName;

        elContentView.innerHTML = "";

        if (!indexData.folders.length) {
          elContentView.appendChild(
            Object.assign(document.createElement("p"), {
              className: "hint",
              textContent: "暂无分类文件夹。请在 docs 下创建一级子文件夹并放入 .md / .html 后重新生成索引。",
            })
          );
          return;
        }

        const folder = resolveBrowseFolder(folderName);
        if (folder !== folderName && folderName) {
          history.replaceState(null, "", "#/browse/" + encodeSeg(folder));
        }
        currentFolderName = folder;

        const tabs = document.createElement("div");
        tabs.className = "folder-tabs";
        tabs.setAttribute("role", "tablist");
        indexData.folders.forEach(function (f) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "folder-tab" + (f.name === folder ? " active" : "");
          btn.textContent = f.name;
          btn.setAttribute("role", "tab");
          btn.setAttribute("aria-selected", f.name === folder ? "true" : "false");
          btn.addEventListener("click", function () {
            setHashBrowse(f.name);
          });
          tabs.appendChild(btn);
        });
        elContentView.appendChild(tabs);

        const tagTitle = document.createElement("p");
        tagTitle.className = "browse-tags-title";
        tagTitle.textContent = "标签（仅 " + folder + "）";
        elContentView.appendChild(tagTitle);

        const tags = collectFolderTagsSorted(folder);
        if (!tags.length) {
          elContentView.appendChild(
            Object.assign(document.createElement("p"), {
              className: "hint",
              textContent: "该文件夹下暂无标签。可在 Markdown 首行添加 tags: 标签1, 标签2 后重新运行 build_index.py。",
            })
          );
          return;
        }

        const grid = document.createElement("div");
        grid.className = "browse-tag-grid";
        tags.forEach(function (t) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "tag-badge";
          b.textContent = t;
          b.addEventListener("click", function () {
            setHashBrowseTag(folder, t);
          });
          grid.appendChild(b);
        });
        elContentView.appendChild(grid);

        const hint = document.createElement("p");
        hint.className = "hint";
        hint.style.marginTop = "1.25rem";
        hint.textContent = "点击标签查看该文件夹内含此标签的文件，再点击文件名打开正文。";
        elContentView.appendChild(hint);
      }

      function renderBrowseTagView(folderName, tag) {
        bumpDocGeneration();
        revokeIframeBlob();
        currentFolderName = folderName;

        const hits = collectTaggedFilesInFolder(folderName, tag);
        elContentView.innerHTML = "";
        appendNavBack("#/browse/" + encodeSeg(folderName));

        const tabs = document.createElement("div");
        tabs.className = "folder-tabs";
        indexData.folders.forEach(function (f) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "folder-tab" + (f.name === folderName ? " active" : "");
          btn.textContent = f.name;
          btn.addEventListener("click", function () {
            setHashBrowse(f.name);
          });
          tabs.appendChild(btn);
        });
        elContentView.appendChild(tabs);

        const sub = document.createElement("p");
        sub.className = "browse-tags-title";
        sub.textContent = "标签：「" + tag + "」";
        elContentView.appendChild(sub);

        const intro = document.createElement("p");
        intro.className = "hint";
        intro.textContent = hits.length ? "共 " + hits.length + " 个文件（仅 " + folderName + "）" : "该文件夹下没有包含此标签的文件";
        elContentView.appendChild(intro);

        const ul = document.createElement("ul");
        ul.className = "tag-filter-list";
        hits.forEach(function (h) {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.type = "button";
          const pathLabel = h.file.path || h.folder + "/" + h.file.name;
          btn.innerHTML =
            "<span>" +
            escapeHtml(h.file.name) +
            '</span><span class="path-muted">' +
            escapeHtml(pathLabel) +
            "</span>";
          btn.addEventListener("click", function () {
            setHashDoc(h.folder, h.file.name);
          });
          li.appendChild(btn);
          ul.appendChild(li);
        });
        elContentView.appendChild(ul);
      }

      function revokeIframeBlob() {
        const frame = document.getElementById("doc-html-frame");
        if (frame && frame.dataset.blobUrl) {
          try {
            URL.revokeObjectURL(frame.dataset.blobUrl);
          } catch (_) {}
          delete frame.dataset.blobUrl;
        }
      }

      function showTagsBadges(tags, onTagClick) {
        const row = document.createElement("div");
        row.className = "tag-row";
        if (!tags || !tags.length) {
          const sp = document.createElement("span");
          sp.className = "hint";
          sp.textContent = "无标签";
          row.appendChild(sp);
          return row;
        }
        tags.forEach(function (t) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "tag-badge";
          b.textContent = t;
          b.addEventListener("click", function () {
            if (typeof onTagClick === "function") onTagClick(t);
          });
          row.appendChild(b);
        });
        return row;
      }

      function stripMdTagsLine(text) {
        var lines = text.split(/\r?\n/);
        if (!lines.length) return text;
        var first = lines[0].trim();
        if (first.toLowerCase().indexOf("tags:") === 0) {
          return lines.slice(1).join("\n").replace(/^\s*\n/, "");
        }
        return text;
      }

      async function renderDoc(folderName, fileName) {
        bumpDocGeneration();
        const gen = docGeneration;
        revokeIframeBlob();
        const found = findFileEntry(folderName, fileName);
        if (!found) {
          if (gen !== docGeneration) return;
          elContentView.innerHTML = "";
          appendNavBack("#/browse/" + encodeSeg(folderName));
          elContentView.appendChild(
            Object.assign(document.createElement("p"), {
              className: "error",
              textContent: "找不到文件：" + folderName + " / " + fileName,
            })
          );
          return;
        }

        const entry = found.entry;
        const tags = entry.tags || [];
        currentFolderName = folderName;
        if (gen !== docGeneration) return;

        elContentView.innerHTML = "";
        appendNavBack("#/browse/" + encodeSeg(folderName));
        const pathLine = document.createElement("p");
        pathLine.className = "hint";
        pathLine.style.marginBottom = "0.75rem";
        pathLine.textContent = entry.path || folderName + "/" + fileName;
        elContentView.appendChild(pathLine);
        elContentView.appendChild(
          showTagsBadges(tags, function (tag) {
            setHashBrowseTag(folderName, tag);
          })
        );

        const lower = entry.name.toLowerCase();
        const url = "./" + entry.path.split("/").map(encodeURIComponent).join("/");

        try {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const text = await res.text();
          if (gen !== docGeneration) return;

          if (lower.endsWith(".md")) {
            const div = document.createElement("div");
            div.className = "md-body";
            const mdSrc = stripMdTagsLine(text);
            try {
              if (typeof marked !== "undefined") {
                div.innerHTML = marked.parse ? marked.parse(mdSrc) : marked(mdSrc);
              } else {
                div.textContent = mdSrc;
              }
            } catch (e) {
              div.textContent = mdSrc;
            }
            elContentView.appendChild(div);
          } else if (lower.endsWith(".html")) {
            const frame = document.createElement("iframe");
            frame.id = "doc-html-frame";
            frame.setAttribute("sandbox", "allow-scripts allow-same-origin");
            frame.title = entry.name;
            const blob = new Blob([text], { type: "text/html;charset=utf-8" });
            const u = URL.createObjectURL(blob);
            frame.src = u;
            frame.dataset.blobUrl = u;
            elContentView.appendChild(frame);
          } else if (lower.endsWith(".json")) {
            try {
              const examData = JSON.parse(text);
              if (examData && examData.questions && Array.isArray(examData.questions)) {
                renderExam(examData, folderName);
              } else {
                elContentView.appendChild(
                  Object.assign(document.createElement("pre"), { textContent: text })
                );
              }
            } catch (e) {
              elContentView.appendChild(
                Object.assign(document.createElement("pre"), { textContent: text })
              );
            }
          } else {
            elContentView.appendChild(
              Object.assign(document.createElement("pre"), { textContent: text })
            );
          }
        } catch (e) {
          if (gen !== docGeneration) return;
          var msg = "加载失败：" + (e && e.message ? e.message : String(e));
          if (isFileProtocol()) {
            msg += " 使用 file:// 时，多数浏览器禁止 fetch 本地 .md/.html 正文；请在本目录执行 python -m http.server 后用 http:// 打开。";
          }
          elContentView.appendChild(
            Object.assign(document.createElement("p"), {
              className: "error",
              textContent: msg,
            })
          );
        }
      }

      function renderTagView(tag) {
        bumpDocGeneration();
        revokeIframeBlob();
        currentFolderName = "";

        const hits = collectTaggedFiles(tag);
        elContentView.innerHTML = "";
        appendNavBack("#/browse/" + encodeSeg(resolveBrowseFolder("")));
        const title = document.createElement("p");
        title.className = "browse-tags-title";
        title.textContent = "标签：「" + tag + "」（全部文件夹）";
        elContentView.appendChild(title);
        const intro = document.createElement("p");
        intro.className = "hint";
        intro.textContent = hits.length ? "共 " + hits.length + " 个文件" : "没有包含该标签的文件";
        elContentView.appendChild(intro);

        const ul = document.createElement("ul");
        ul.className = "tag-filter-list";
        hits.forEach(function (h) {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.type = "button";
          const pathLabel = h.file.path || h.folder + "/" + h.file.name;
          btn.innerHTML =
            "<span>" +
            escapeHtml(h.file.name) +
            '</span><span class="path-muted">' +
            escapeHtml(pathLabel) +
            "</span>";
          btn.addEventListener("click", function () {
            setHashDoc(h.folder, h.file.name);
          });
          li.appendChild(btn);
          ul.appendChild(li);
        });
        elContentView.appendChild(ul);
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderExam(examData, folderName) {
        bumpDocGeneration();
        revokeIframeBlob();
        currentFolderName = folderName;
        elContentView.innerHTML = "";
        appendNavBack("#/browse/" + encodeSeg(folderName));

        var submitted = false;
        var timerInterval = null;
        var timeLeft = 1800;

        var title = document.createElement("h1");
        title.className = "exam-title";
        title.textContent = examData.title || "试卷";
        elContentView.appendChild(title);

        var timerEl = document.createElement("div");
        timerEl.className = "exam-timer";
        elContentView.appendChild(timerEl);

        function updateTimerDisplay() {
          var min = Math.floor(timeLeft / 60);
          var sec = timeLeft % 60;
          timerEl.textContent = "⏱ " + String(min).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
          if (timeLeft <= 60) {
            timerEl.classList.add("warning");
          } else {
            timerEl.classList.remove("warning");
          }
        }

        function startTimer() {
          updateTimerDisplay();
          timerInterval = setInterval(function () {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
              clearInterval(timerInterval);
              timerInterval = null;
              if (!submitted) {
                doSubmit(true);
              }
            }
          }, 1000);
        }

        if (examData.meta) {
          var m = examData.meta;
          var metaP = document.createElement("p");
          metaP.className = "exam-meta";
          var parts = [];
          if (m.total) parts.push("共 " + m.total + " 题");
          if (m.totalScore) parts.push("总分 " + m.totalScore + " 分");
          if (m.singleCount) parts.push("单选 " + m.singleCount + " 道");
          if (m.multiCount) parts.push("多选 " + m.multiCount + " 道");
          parts.push("时间 30 分钟");
          metaP.textContent = parts.join(" · ");
          elContentView.appendChild(metaP);
          if (m.note) {
            var noteP = document.createElement("p");
            noteP.className = "hint";
            noteP.style.marginTop = "-0.75rem";
            noteP.style.marginBottom = "0.75rem";
            noteP.textContent = "注意：" + m.note;
            elContentView.appendChild(noteP);
          }
        }

        var questions = examData.questions || [];
        var singleQ = questions.filter(function (q) { return q.type === "single"; });
        var multiQ = questions.filter(function (q) { return q.type === "multiple"; });

        var state = {};
        questions.forEach(function (q) {
          state[q.id] = { selected: q.type === "single" ? "" : [] };
        });

        function disableAllInputs() {
          var allInputs = elContentView.querySelectorAll(".option-item input");
          allInputs.forEach(function (inp) {
            inp.disabled = true;
          });
          var allOptions = elContentView.querySelectorAll(".option-item");
          allOptions.forEach(function (o) {
            o.classList.add("disabled");
          });
        }

        function doSubmit(isAuto) {
          if (submitted) return;
          submitted = true;
          if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
          }

          var correctCount = 0;
          questions.forEach(function (q) {
            var card = document.getElementById("q-card-" + q.id);
            if (!card) return;
            card.classList.remove("correct", "wrong");
            var userAns = state[q.id].selected;
            var isCorrect = false;
            if (q.type === "single") {
              isCorrect = (String(userAns) === String(q.answer));
            } else {
              if (Array.isArray(userAns) && Array.isArray(q.answer)) {
                var sorted1 = userAns.slice().sort().join(",");
                var sorted2 = q.answer.slice().sort().join(",");
                isCorrect = (sorted1 === sorted2);
              }
            }
            if (isCorrect) {
              card.classList.add("correct");
              correctCount++;
            } else {
              card.classList.add("wrong");
              var opts = card.querySelectorAll(".option-item");
              opts.forEach(function (o) {
                var inp = o.querySelector("input");
                if (!inp) return;
                var isCorrectOpt = false;
                if (q.type === "single") {
                  isCorrectOpt = (inp.value === String(q.answer));
                } else {
                  isCorrectOpt = (q.answer.indexOf(inp.value) !== -1);
                }
                if (isCorrectOpt) {
                  o.classList.add("correct-answer");
                } else if (inp.checked) {
                  o.classList.add("wrong-selected");
                }
              });
            }
          });

          disableAllInputs();

          var submitBtn = document.getElementById("exam-submit-btn");
          var resetBtn = document.getElementById("exam-reset-btn");
          if (submitBtn) submitBtn.disabled = true;
          if (resetBtn) resetBtn.disabled = true;

          if (isAuto) {
            timerEl.textContent = "⏱ 时间到！";
          }

          var existingScore = document.getElementById("exam-score");
          if (existingScore) existingScore.remove();
          var total = questions.length;
          var scoreEl = document.createElement("div");
          scoreEl.id = "exam-score";
          scoreEl.className = "exam-score";
          scoreEl.textContent = "得分：" + correctCount + " / " + total + "（正确 " + correctCount + " 题，错误 " + (total - correctCount) + " 题）";
          document.getElementById("exam-actions-wrapper").appendChild(scoreEl);
        }

        function renderQuestions() {
          var container = document.getElementById("exam-questions-container");
          if (!container) return;
          container.innerHTML = "";

          if (singleQ.length) {
            var sTitle = document.createElement("h2");
            sTitle.className = "exam-section-title";
            sTitle.textContent = "一、单选题（每题 " + (examData.meta ? examData.meta.singleScore || 3 : 3) + " 分）";
            container.appendChild(sTitle);
            singleQ.forEach(function (q) {
              container.appendChild(buildQuestionCard(q));
            });
          }

          if (multiQ.length) {
            var mTitle = document.createElement("h2");
            mTitle.className = "exam-section-title";
            mTitle.textContent = "二、多选题（每题 " + (examData.meta ? examData.meta.multiScore || 4 : 4) + " 分，至少有两个正确选项）";
            container.appendChild(mTitle);
            multiQ.forEach(function (q) {
              container.appendChild(buildQuestionCard(q));
            });
          }

          var actions = document.createElement("div");
          actions.className = "exam-actions";

          var submitBtn = document.createElement("button");
          submitBtn.type = "button";
          submitBtn.id = "exam-submit-btn";
          submitBtn.className = "btn-primary";
          submitBtn.textContent = "提交";
          submitBtn.addEventListener("click", function () {
            doSubmit(false);
          });

          var resetBtn = document.createElement("button");
          resetBtn.type = "button";
          resetBtn.id = "exam-reset-btn";
          resetBtn.className = "btn-reset";
          resetBtn.textContent = "重置";
          resetBtn.addEventListener("click", function () {
            if (submitted) return;
            var existingScore = document.getElementById("exam-score");
            if (existingScore) existingScore.remove();
            questions.forEach(function (q) {
              state[q.id].selected = q.type === "single" ? "" : [];
              var card = document.getElementById("q-card-" + q.id);
              if (card) {
                card.classList.remove("correct", "wrong");
              }
              var opts = document.querySelectorAll("#q-card-" + q.id + " .option-item");
              opts.forEach(function (o) {
                o.classList.remove("selected");
                var inp = o.querySelector("input");
                if (inp) {
                  if (inp.type === "radio") inp.checked = false;
                  else if (inp.type === "checkbox") inp.checked = false;
                }
              });
            });
          });

          actions.appendChild(submitBtn);
          actions.appendChild(resetBtn);
          actions.id = "exam-actions-wrapper";
          container.appendChild(actions);
        }

        function buildQuestionCard(q) {
          var card = document.createElement("div");
          card.className = "question-card";
          card.id = "q-card-" + q.id;

          var header = document.createElement("div");
          header.className = "q-header";

          var num = document.createElement("span");
          num.className = "q-number";
          num.textContent = q.id + ".";
          header.appendChild(num);

          var typeBadge = document.createElement("span");
          typeBadge.className = "q-type" + (q.type === "multiple" ? " multi" : "");
          typeBadge.textContent = q.type === "single" ? "单选" : "多选";
          header.appendChild(typeBadge);

          card.appendChild(header);

          var qText = document.createElement("div");
          qText.className = "q-text";
          qText.textContent = q.question;
          card.appendChild(qText);

          var list = document.createElement("ul");
          list.className = "options-list";

          q.options.forEach(function (opt) {
            var li = document.createElement("li");
            li.className = "option-item";

            var input = document.createElement("input");
            if (q.type === "single") {
              input.type = "radio";
              input.name = "q-" + q.id;
            } else {
              input.type = "checkbox";
              input.name = "q-" + q.id;
            }
            input.value = opt.label;

            input.addEventListener("change", function () {
              if (submitted) {
                input.checked = !input.checked;
                return;
              }
              var existingScore = document.getElementById("exam-score");
              if (existingScore) existingScore.remove();
              var cardEl = document.getElementById("q-card-" + q.id);
              if (cardEl) cardEl.classList.remove("correct", "wrong");
              if (q.type === "single") {
                if (input.checked) {
                  state[q.id].selected = opt.label;
                  var siblings = list.querySelectorAll(".option-item");
                  siblings.forEach(function (s) {
                    s.classList.remove("selected");
                  });
                  li.classList.add("selected");
                }
              } else {
                if (input.checked) {
                  state[q.id].selected.push(opt.label);
                  li.classList.add("selected");
                } else {
                  var idx = state[q.id].selected.indexOf(opt.label);
                  if (idx !== -1) state[q.id].selected.splice(idx, 1);
                  li.classList.remove("selected");
                }
              }
            });

            li.appendChild(input);

            var labelSpan = document.createElement("span");
            labelSpan.className = "option-label";
            labelSpan.textContent = opt.label + ".";
            li.appendChild(labelSpan);

            var textSpan = document.createElement("span");
            textSpan.className = "option-text";
            textSpan.textContent = opt.text;
            li.appendChild(textSpan);

            li.addEventListener("click", function (e) {
              if (e.target.tagName !== "INPUT") {
                var inp = li.querySelector("input");
                if (inp && !inp.disabled) {
                  inp.click();
                }
              }
            });

            list.appendChild(li);
          });

          card.appendChild(list);
          return card;
        }

        var questionsContainer = document.createElement("div");
        questionsContainer.id = "exam-questions-container";
        elContentView.appendChild(questionsContainer);

        renderQuestions();
        startTimer();
      }

      function route() {
        const r = parseHash();
        if (r.kind === "browse") {
          const folder = resolveBrowseFolder(r.folder);
          if (folder && r.folder && folder !== r.folder) {
            history.replaceState(null, "", "#/browse/" + encodeSeg(folder));
          }
          renderBrowse(folder);
          return;
        }
        if (r.kind === "browse_tag") {
          const folder = resolveBrowseFolder(r.folder);
          if (folder && r.folder && folder !== r.folder) {
            history.replaceState(null, "", "#/browse/" + encodeSeg(folder) + "/tag/" + encodeSeg(r.tag));
          }
          renderBrowseTagView(folder, r.tag);
          return;
        }
        if (r.kind === "tag") {
          renderTagView(r.tag);
          return;
        }
        if (r.kind === "doc") {
          renderDoc(r.folder, r.file);
          return;
        }
        const def = resolveBrowseFolder("");
        if (def) {
          history.replaceState(null, "", "#/browse/" + encodeSeg(def));
        }
        renderBrowse(def);
      }

      window.addEventListener("hashchange", route);

      function isFileProtocol() {
        return (window.location && window.location.protocol) === "file:";
      }

      async function boot() {
        try {
          var embedded =
            typeof window.__KB_INDEX__ !== "undefined" && window.__KB_INDEX__ !== null;
          if (embedded) {
            indexData = window.__KB_INDEX__;
          } else {
            const res = await fetch("./index.json", { cache: "no-store" });
            if (!res.ok) throw new Error("无法读取 index.json（HTTP " + res.status + "）");
            indexData = await res.json();
          }
          if (!indexData || !Array.isArray(indexData.folders)) {
            indexData = { folders: [] };
          }
        } catch (e) {
          elContentView.innerHTML = "";
          var hint =
            "加载索引失败：" +
            (e && e.message ? e.message : String(e)) +
            "。请先运行：python build_index.py docs（会生成 index.json 与 index.inline.js）。";
          if (isFileProtocol()) {
            hint +=
              " 使用 file:// 打开时依赖 index.inline.js；若正文无法加载，请改用本地 HTTP 服务（如 python -m http.server）打开本目录。";
          } else {
            hint += " 若使用 file:// 打开页面，浏览器通常会禁止 fetch，请改用 http:// 访问同一目录。";
          }
          elContentView.appendChild(
            Object.assign(document.createElement("p"), {
              className: "error",
              textContent: hint,
            })
          );
          return;
        }
        route();
      }

      boot();
    })();
  </script>
